<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Editor & Preview</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Martian+Mono:wght@700&display=swap" rel="stylesheet">
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
  
  <!-- js-beautify -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-css.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Light Mode Palette */
      --bg-color: #f8fafc;
      --surface-color: #ffffff;
      --toolbar-bg: rgba(255, 255, 255, 0.75);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --divider: #e2e8f0;
      --divider-hover: #94a3b8;
      --btn-bg: transparent;
      --btn-hover: #f1f5f9;
      --btn-active: #e2e8f0;
      --logo-color: #2563eb;
    }

    body.dark-mode {
      /* Dark Mode Palette */
      --bg-color: #0f172a;
      --surface-color: #1e293b;
      --toolbar-bg: rgba(15, 23, 42, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --divider: #334155;
      --divider-hover: #64748b;
      --btn-bg: transparent;
      --btn-hover: #334155;
      --btn-active: #475569;
      --logo-color: #60a5fa;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow: hidden;
    }

    /* --- Toolbar UI --- */
    #toolbar {
      padding: 10px 20px;
      background: var(--toolbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 56px;
      z-index: 100;
      position: relative;
    }

    .logo {
      font-family: "Martian Mono", monospace;
      font-weight: 700;
      color: var(--logo-color);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
    }

    .logo svg {
      width: 22px;
      height: 22px;
      stroke: var(--logo-color);
    }

    .toolbar-buttons {
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--btn-bg);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      width: 36px;
      height: 36px;
    }

    .tool-btn:hover {
      background: var(--btn-hover);
      color: var(--text-main);
    }

    .tool-btn:active {
      background: var(--btn-active);
      transform: scale(0.96);
    }

    .tool-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    /* Theme Toggle Logic */
    #theme-btn .sun-icon { display: none; }
    #theme-btn .moon-icon { display: block; }
    .dark-mode #theme-btn .sun-icon { display: block; }
    .dark-mode #theme-btn .moon-icon { display: none; }

    /* --- Editor Container --- */
    .container {
      height: calc(100% - 56px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .horizontal { flex-direction: row; }

    /* --- CodeMirror Tweaks --- */
    #editor-container {
      background: var(--surface-color);
      display: flex;
      flex-direction: column;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1.6;
      background-color: var(--surface-color) !important;
      color: var(--text-main) !important;
    }

    .CodeMirror-gutters {
      border-right: 1px solid var(--border-color) !important;
      background-color: var(--surface-color) !important;
    }
    
    .CodeMirror-linenumber {
      color: var(--text-muted) !important;
      opacity: 0.7;
    }

    .dark-mode .CodeMirror {
      background-color: #282a36 !important; /* Retain Dracula bg for syntax contrast */
    }
    .dark-mode .CodeMirror-gutters {
      background-color: #282a36 !important;
      border-right: 1px solid #44475a !important;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border: 3px solid var(--surface-color);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    .dark-mode ::-webkit-scrollbar-thumb {
      border: 3px solid #282a36;
      background: #44475a;
    }
    .dark-mode ::-webkit-scrollbar-thumb:hover { background: #6272a4; }

    /* --- Preview Area --- */
    #preview {
      background: #ffffff;
      overflow: hidden;
      flex: 1;
      position: relative;
    }

    #preview iframe {
      border: none;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
      background: #ffffff;
    }

    /* --- Resizable Divider --- */
    #divider {
      background: var(--border-color);
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    /* Invisible Hit Area for easier grabbing */
    #divider::after {
      content: '';
      position: absolute;
      top: -4px; bottom: -4px; left: -4px; right: -4px;
      z-index: 11;
    }

    /* The visual grab handle pill */
    #divider::before {
      content: '';
      position: absolute;
      background: var(--divider-hover);
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 12;
    }

    #divider:hover::before, #divider:active::before {
      opacity: 1;
    }

    .vertical #divider {
      height: 1px;
      width: 100%;
      cursor: row-resize;
    }
    .vertical #divider::before {
      width: 48px;
      height: 4px;
    }
    .vertical #divider:active::before {
      transform: scaleY(1.5);
    }

    .horizontal #divider {
      width: 1px;
      height: 100%;
      cursor: col-resize;
    }
    .horizontal #divider::before {
      width: 4px;
      height: 48px;
    }
    .horizontal #divider:active::before {
      transform: scaleX(1.5);
    }

    /* Flex basis assignments */
    .vertical #editor-container { height: 50%; width: 100%; }
    .horizontal #editor-container { width: 50%; height: 100%; }
    
    /* Tooltip Native override - tricky in CSS, but title attribute works. */
  </style>
</head>

<body>
  <div id="toolbar">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>htmleditor</span>
    </div>

    <div class="toolbar-buttons">
      <button id="format-btn" class="tool-btn" title="Format Code">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.9 5.8a2 2 0 0 1-1.275 1.275L3 12l5.8 1.9a2 2 0 0 1 1.275 1.275L12 21l1.9-5.8a2 2 0 0 1 1.275-1.275L21 12l-5.8-1.9a2 2 0 0 1-1.275-1.275L12 3Z"/>
          <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
        </svg>
      </button>

      <button id="download-btn" class="tool-btn" title="Download HTML">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
      </button>

      <button id="layout-btn" class="tool-btn" title="Toggle Layout">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M3 12h18"/>
        </svg>
      </button>

      <button id="theme-btn" class="tool-btn" title="Toggle Theme">
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>

      <button id="fullscreen-btn" class="tool-btn" title="Toggle Fullscreen">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="container horizontal" id="container">
    <div id="editor-container">
      <textarea id="editor"></textarea>
    </div>
    <div id="divider"></div>
    <div id="preview">
      <iframe></iframe>
    </div>
  </div>

  <!-- CodeMirror JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>

  <script>
    // Initialize CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: 'htmlmixed',
      theme: 'default',
      lineNumbers: true,
      autoCloseTags: true,
      autoCloseBrackets: true,
      indentUnit: 2,
      tabSize: 2,
      lineWrapping: true
    });

    const preview = document.getElementById('preview');
    const divider = document.getElementById('divider');
    const container = document.getElementById('container');
    const layoutBtn = document.getElementById('layout-btn');
    const themeBtn = document.getElementById('theme-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const downloadBtn = document.getElementById('download-btn');
    const formatBtn = document.getElementById('format-btn');

    // Default content
    const defaultContent = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern HTML Preview</title>
</head>
<body>
  <h1>Hello, World! ✨</h1>
  <p>This is your modern HTML playground.</p>
</body>
</html>`;

    // Load saved preferences
    function loadPreferences() {
      const savedLayout = localStorage.getItem('editorLayout') || 'horizontal';
      container.className = `container ${savedLayout}`;
      updateLayoutIcon(savedLayout);

      const savedTheme = localStorage.getItem('editorTheme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        editor.setOption('theme', 'dracula');
      } else {
        document.body.classList.remove('dark-mode');
        editor.setOption('theme', 'default');
      }

      const savedContent = localStorage.getItem('editorContent');
      editor.setValue(savedContent || defaultContent);
      
      resetSizes();
    }

    // Update Layout Icon dynamically
    function updateLayoutIcon(layout) {
      const svg = layoutBtn.querySelector('svg');
      if (layout === 'horizontal') {
        svg.innerHTML = '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/>';
      } else {
        svg.innerHTML = '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/>';
      }
    }

    function saveEditorContent() {
      localStorage.setItem('editorContent', editor.getValue());
    }

    // Render Preview with Debounce for performance
    let previewTimeout;
    function updatePreview() {
      const content = editor.getValue();
      saveEditorContent();

      clearTimeout(previewTimeout);
      previewTimeout = setTimeout(() => {
        let iframe = preview.querySelector('iframe');
        if (!iframe) {
          iframe = document.createElement('iframe');
          preview.innerHTML = '';
          preview.appendChild(iframe);
        }
        iframe.srcdoc = content;
      }, 250); // wait 250ms after typing stops
    }

    editor.on('change', updatePreview);
    setInterval(saveEditorContent, 5000); // Failsafe backup

    // Format code using js-beautify
    formatBtn.addEventListener('click', () => {
      const content = editor.getValue();
      const formatted = html_beautify(content, {
        indent_size: 2,
        indent_inner_html: true,
        extra_liners: ['head', 'body', '/html']
      });
      editor.setValue(formatted);
    });

    // Layout toggle
    layoutBtn.addEventListener('click', () => {
      const isVertical = container.classList.contains('vertical');
      const newLayout = isVertical ? 'horizontal' : 'vertical';
      container.className = `container ${newLayout}`;
      localStorage.setItem('editorLayout', newLayout);
      updateLayoutIcon(newLayout);
      resetSizes();
    });

    // Theme toggle
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      editor.setOption('theme', isDark ? 'dracula' : 'default');
      localStorage.setItem('editorTheme', isDark ? 'dark' : 'light');
    });

    // Fullscreen toggle
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error attempting to enable fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Download functionality
    downloadBtn.addEventListener('click', () => {
      const content = editor.getValue();
      const blob = new Blob([content], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Resizable Divider Logic
    let isDragging = false;
    divider.addEventListener('mousedown', function(e) {
      e.preventDefault();
      isDragging = true;
      document.body.style.cursor = container.classList.contains('horizontal') ? 'col-resize' : 'row-resize';
      document.body.style.userSelect = 'none'; // Prevent text selection while dragging
      preview.style.pointerEvents = 'none'; // Fix iframe capturing mouse events
    });

    window.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = 'default';
        document.body.style.userSelect = 'auto';
        preview.style.pointerEvents = 'auto';
      }
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      
      const containerRect = container.getBoundingClientRect();
      if (container.classList.contains('horizontal')) {
        const newWidth = e.clientX - containerRect.left;
        const percentage = (newWidth / containerRect.width) * 100;
        document.querySelector('#editor-container').style.width = Math.max(10, Math.min(90, percentage)) + '%';
      } else {
        const newHeight = e.clientY - containerRect.top;
        const percentage = (newHeight / containerRect.height) * 100;
        document.querySelector('#editor-container').style.height = Math.max(10, Math.min(90, percentage)) + '%';
      }
    });

    // Reset editor size on layout switch
    function resetSizes() {
      if (container.classList.contains('horizontal')) {
        document.querySelector('#editor-container').style.width = '50%';
        document.querySelector('#editor-container').style.height = '100%';
      } else {
        document.querySelector('#editor-container').style.height = '50%';
        document.querySelector('#editor-container').style.width = '100%';
      }
      editor.refresh();
    }

    // Auto-resize CodeMirror
    const resizeObserver = new ResizeObserver(() => {
      editor.refresh();
    });
    resizeObserver.observe(document.querySelector('#editor-container'));

    // Init
    window.addEventListener('DOMContentLoaded', loadPreferences);
  </script>
</body>
</html>
