    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const cards = document.querySelectorAll('.tool-card');
            const noResults = document.getElementById('no-results-message');
            const toolsContainer = document.getElementById('tools-container');

            // Keyboard shortcut (Cmd/Ctrl + K) to focus search
            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                    e.preventDefault();
                    searchInput.focus();
                }
            });

            // Search logic with smooth transitions
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                let hasVisibleCards = false;

                cards.forEach(card => {
                    const searchKeywords = card.getAttribute('data-name');
                    // Add Title and Description to searchable text for better results
                    const textContent = card.innerText.toLowerCase(); 
                    
                    if (searchKeywords.includes(query) || textContent.includes(query)) {
                        card.style.display = 'flex';
                        // Add a tiny delay to re-trigger animation if needed
                        requestAnimationFrame(() => {
                            card.style.opacity = '1';
                            card.style.transform = 'translateY(0)';
                        });
                        hasVisibleCards = true;
                    } else {
                        card.style.display = 'none';
                        card.style.opacity = '0';
                    }
                });

                if (hasVisibleCards) {
                    noResults.classList.add('hidden');
                    noResults.classList.remove('flex');
                    toolsContainer.style.display = 'grid';
                } else {
                    noResults.classList.remove('hidden');
                    noResults.classList.add('flex');
                    toolsContainer.style.display = 'none';
                }
            });
            
            // Focus search on load for desktop
            if (window.innerWidth > 768) {
                setTimeout(() => searchInput.focus(), 500);
            }
        });
    </script>
