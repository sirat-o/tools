<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #080b10;
            --bg-card: #121620;
            --border-color: #212631;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.15);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
        }

        /* Modern Gradient Background Glows */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        body::before { top: -100px; right: -50px; }
        body::after { bottom: -100px; left: -50px; }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            flex: 1;
        }

        /* Advanced Header & Search Controls */
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 3.5rem;
            gap: 1.5rem;
        }

        .logo-area h1 {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 450px;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .search-box input:focus + i {
            color: var(--text-main);
        }

        /* Dynamic Tools Grid */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Tool Card Styles */
        .tool-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05) 0%, transparent 50%);
            opacity: 0;
            transition: var(--transition);
        }

        .tool-card:hover::before {
            opacity: 1;
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 1.25rem;
            transition: var(--transition);
        }

        .tool-card:hover .icon-box {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
            transform: scale(1.05);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        /* Custom Badges for specific states */
        .badge.active {
            background-color: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.2);
        }

        .card-body h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card-body p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .card-footer {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .tool-card:hover .card-footer {
            color: var(--text-main);
        }

        .card-footer i {
            transition: var(--transition);
        }

        .tool-card:hover .card-footer i {
            transform: translateX(4px);
        }

        /* No Results Message */
        .no-results {
            display: none;
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
            font-size: 1.1rem;
        }

        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header-section">
            <div class="logo-area">
                <h1>tools</h1>
                <p>A collection of useful web utilities</p>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search tools...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </header>

        <main>
            <div class="tools-grid" id="tools-container">
                
                <a href="playlist_maker.html" class="tool-card" data-name="playlist maker music curation audio template">
                    <div class="card-top">
                        <div class="icon-box">
                            <i class="fa-solid fa-tv"></i>
                        </div>
                        <span class="badge active">Live</span>
                    </div>
                    <div class="card-body">
                        <h2>Playlist Maker</h2>
                        <p>Generate, edit, and organize clean `.m3u` or `.m3u8` playlists with proper group tags and channel parameters</p>
                    </div>
                    <div class="card-footer">
                        Open tool <i class="fa-solid fa-arrow-right-long"></i>
                    </div>
                </a>

                <a href="#" class="tool-card" data-name="placeholder tool future feature">
                    <div class="card-top">
                        <div class="icon-box">
                            <i class="fa-solid fa-cubes"></i>
                        </div>
                        <span class="badge">In Progress</span>
                    </div>
                    <div class="card-body">
                        <h2>Next Tool</h2>
                    </div>
                    <div class="card-footer">
                        Coming Soon <i class="fa-solid fa-arrow-right-long"></i>
                    </div>
                </a>

            </div>

            <div class="no-results" id="no-results-message">
                <i class="fa-solid fa-face-frown" style="margin-bottom: 0.5rem; font-size: 1.5rem;"></i>
                <p>No tools match your query.</p>
            </div>
        </main>

    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const cards = document.querySelectorAll('.tool-card');
        const noResults = document.getElementById('no-results-message');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            let hasVisibleCards = false;

            cards.forEach(card => {
                const searchKeywords = card.getAttribute('data-name');
                if (searchKeywords.includes(query)) {
                    card.style.display = 'flex';
                    hasVisibleCards = true;
                } else {
                    card.style.display = 'none';
                }
            });

            noResults.style.display = hasVisibleCards ? 'none' : 'block';
        });
    </script>

</body>
</html>
